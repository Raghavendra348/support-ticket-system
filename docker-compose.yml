version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: supportdesk_mysql
    restart: always
    environment:
      MYSQL_DATABASE: support_ticket_db
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_USER: support_user
      MYSQL_PASSWORD: support_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  # Django Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportdesk_backend
    restart: always
    environment:
      SECRET_KEY: django-insecure-production-secret-key-assessment
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DB_NAME: support_ticket_db
      DB_USER: root
      DB_PASSWORD: root_password_123
      DB_HOST: db
      DB_PORT: "3306"
      JWT_SECRET: jwt-insecure-secret-key-assessment
      JWT_ACCESS_MINUTES: "60"
      JWT_REFRESH_DAYS: "7"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  # React Frontend Service (Development / Preview)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportdesk_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api

volumes:
  mysql_data:
